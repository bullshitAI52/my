<!DOCTYPE html>
<html>
<head>
    <title>测试头像</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #2563eb; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>头像功能测试</h1>
    
    <div id="status"></div>
    
    <h2>测试本地头像文件：</h2>
    <img src="avatar.jpeg" alt="测试头像1" class="avatar" id="test1">
    <p>文件: avatar.jpeg</p>
    
    <h2>测试另一个头像文件：</h2>
    <img src="头像.jpg" alt="测试头像2" class="avatar" id="test2">
    <p>文件: 头像.jpg</p>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const status = document.getElementById('status');
            const test1 = document.getElementById('test1');
            const test2 = document.getElementById('test2');
            
            let successCount = 0;
            let errorCount = 0;
            
            // 测试第一个头像
            test1.onload = function() {
                successCount++;
                updateStatus();
            };
            test1.onerror = function() {
                errorCount++;
                updateStatus();
            };
            
            // 测试第二个头像
            test2.onload = function() {
                successCount++;
                updateStatus();
            };
            test2.onerror = function() {
                errorCount++;
                updateStatus();
            };
            
            function updateStatus() {
                if (successCount + errorCount === 2) {
                    if (errorCount === 0) {
                        status.innerHTML = `<div class="status success">✅ 两个头像文件都能正常加载！</div>`;
                    } else if (successCount === 0) {
                        status.innerHTML = `<div class="status error">❌ 两个头像文件都无法加载</div>`;
                    } else {
                        status.innerHTML = `<div class="status">⚠️ ${successCount}个成功，${errorCount}个失败</div>`;
                    }
                }
            }
            
            // 触发加载
            test1.src = test1.src + '?t=' + Date.now();
            test2.src = test2.src + '?t=' + Date.now();
        });
    </script>
</body>
</html>
